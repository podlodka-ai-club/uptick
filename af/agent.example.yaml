schema_version: 2

agent:
  id: af-sgr
  version: af-sgr-v2-0.1

reasoners:
  decision:
    provider: codex
    model: gpt-5.6-sol
    effort: medium
    thread_mode: ephemeral
    timeout_seconds: 600
    retries: 1
  learner:
    provider: codex
    model: gpt-5.6-terra
    effort: high
    thread_mode: ephemeral
    timeout_seconds: 600
    retries: 1

memory:
  backend: sqlite
  path: .agent/memory.sqlite

learning:
  trigger: after_run
  min_evidence_groups: 2

run_store:
  backend: jsonl
  path: .artifacts/runs

environment:
  adapter: uptickv2
  endpoint: http://localhost:8080
  participant_token:
    from_env: UPTICK_PARTICIPANT_TOKEN
  prompt_file: prompts/uptickv2.md
  seed: 1
  step_limit: null
