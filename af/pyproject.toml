[project]
name = "uptick-agent"
version = "0.6.0"
description = "Schema-Guided Reasoning agent with discovered Uptick v2 tools and episode learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "jsonschema>=4.23,<5",
    "openai>=2.11.0,<3",
    "pydantic>=2.12.0,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
uptick-agent = "uptick_agent.cli:main"

[project.optional-dependencies]
codex = [
    "openai-codex==0.147.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uptick_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
