[project]
name = "uptick-agent"
version = "0.1.0"
description = "A small, extensible Schema-Guided Reasoning agent for the Uptick SRE simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "openai>=2.11.0,<3",
    "pydantic>=2.12.0,<3",
]

[project.scripts]
uptick-agent = "uptick_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
